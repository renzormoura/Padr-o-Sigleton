<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 Z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1100" height="720" fill="#f8fafc"/>
  <rect x="0" y="0" width="1100" height="92" fill="#0f766e"/>
  <text x="550" y="42" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Diagrama de Classes</text>
  <text x="550" y="70" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#ccfbf1">Calculadora de Nota com Singleton</text>

  <g filter="url(#shadow)">
    <rect x="105" y="150" width="590" height="430" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
    <rect x="105" y="150" width="590" height="88" rx="8" fill="#ccfbf1"/>
    <rect x="105" y="214" width="590" height="24" fill="#ccfbf1"/>
  </g>
  <text x="400" y="181" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-style="italic" fill="#115e59">&lt;&lt;Singleton&gt;&gt;</text>
  <text x="400" y="211" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#134e4a">CalculadoraNota</text>
  <line x1="105" y1="238" x2="695" y2="238" stroke="#0f766e" stroke-width="2"/>

  <text x="130" y="270" font-family="Consolas, monospace" font-size="17" fill="#334155">- instancia: CalculadoraNota</text>
  <text x="130" y="302" font-family="Consolas, monospace" font-size="17" fill="#334155">- nota: float</text>
  <text x="130" y="334" font-family="Consolas, monospace" font-size="17" fill="#334155">- frequencia: float</text>
  <line x1="105" y1="356" x2="695" y2="356" stroke="#cbd5e1" stroke-width="2"/>
  <text x="130" y="390" font-family="Consolas, monospace" font-size="17" fill="#334155">- CalculadoraNota()</text>
  <text x="130" y="422" font-family="Consolas, monospace" font-size="17" fill="#334155">+ getInstancia(): CalculadoraNota</text>
  <text x="130" y="454" font-family="Consolas, monospace" font-size="17" fill="#334155">+ setNota(nota: float): void</text>
  <text x="130" y="486" font-family="Consolas, monospace" font-size="17" fill="#334155">+ setFrequencia(frequencia: float): void</text>
  <text x="130" y="518" font-family="Consolas, monospace" font-size="17" fill="#334155">+ calcularSituacao(): String</text>
  <text x="130" y="553" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#0f766e">Construtor privado: impede new fora da classe</text>

  <g filter="url(#shadow)">
    <rect x="790" y="250" width="245" height="220" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <rect x="790" y="250" width="245" height="70" rx="8" fill="#e2e8f0"/>
    <rect x="790" y="300" width="245" height="20" fill="#e2e8f0"/>
  </g>
  <text x="912" y="278" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-style="italic" fill="#475569">&lt;&lt;test&gt;&gt;</text>
  <text x="912" y="306" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1e293b">CalculadoraNotaTest</text>
  <line x1="790" y1="320" x2="1035" y2="320" stroke="#64748b" stroke-width="2"/>
  <text x="812" y="354" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Testa a instancia unica</text>
  <text x="812" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Testa aprovado</text>
  <text x="812" y="418" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Testa recuperacao</text>
  <text x="812" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Testa reprovacao</text>

  <line x1="790" y1="360" x2="698" y2="360" stroke="#334155" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow)"/>
  <text x="746" y="345" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#475569">usa</text>

  <rect x="105" y="625" width="930" height="48" rx="6" fill="#ecfeff" stroke="#99f6e4"/>
  <circle cx="133" cy="649" r="9" fill="#0f766e"/>
  <text x="153" y="655" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#134e4a">Uma unica instancia e compartilhada por todo o sistema.</text>
</svg>
